name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PawSanctuaryTests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' \
            | sort -Vr | head -1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run PawSanctuaryTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PawSanctuary.xcodeproj \
            -scheme PawSanctuary \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log

      # BoardAnimationSnapshotTests (PawSanctuaryTests/BoardAnimationSnapshotTests.swift)
      # screenshots the merge burst and producer shimmer from
      # specs/Spec_BoardAnimation_Draft.md and attaches each as a PNG
      # XCTAttachment — the closest thing to an on-screen check available
      # where no local Simulator exists. Runs `if: always()` so a real test
      # failure above still gets whatever frames were captured before it.
      - name: Extract board-animation snapshots from the xcresult bundle
        if: always()
        run: |
          # GitHub Actions launches `run:` steps as `bash -e {0}` — that -e is
          # already active before this script starts, so a `set -uo pipefail`
          # here does NOT turn it off (it only touches -u/pipefail). Every
          # command below is expected to sometimes fail (find/grep no-match)
          # as ordinary, handled control flow, so -e must be explicitly
          # cancelled or any one of them kills this whole step.
          set +e
          set -u

          # Third attempt at this. The first two (pulling
          # FileManager.default.temporaryDirectory out of the Simulator's
          # app-container sandbox via `simctl get_app_container`, then
          # sniffing the xcresult's Data/ directory for raw PNG blobs) both
          # came up empty for reasons not fully pinned down — plausibly a
          # newer xcresult internal format (this project is on Xcode's
          # objectVersion 77 — recent enough that the old flat Data/
          # blob-store layout from Xcode <=15 may no longer apply). Rather
          # than guess a fourth time, this run is deliberately half
          # diagnostic: dump the bundle's real structure and xcresulttool's
          # own --help output unconditionally, so the next attempt (if this
          # one's export call is also wrong) is informed instead of blind.
          XCRESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" -iname "*.xcresult" -type d 2>/dev/null | head -1)
          echo "xcresult bundle: '${XCRESULT}'"
          if [ -z "$XCRESULT" ]; then
            echo "No .xcresult bundle found — skipping snapshot extraction" >&2
            exit 0
          fi

          echo "== xcresult bundle structure (3 levels deep) =="
          find "$XCRESULT" -maxdepth 3

          echo "== xcrun xcresulttool export --help =="
          xcrun xcresulttool export --help 2>&1

          echo "== xcrun xcresulttool export attachments --help =="
          xcrun xcresulttool export attachments --help 2>&1

          mkdir -p board-animation-snapshots
          echo "== attempting: xcresulttool export attachments =="
          xcrun xcresulttool export attachments --path "$XCRESULT" --output-path board-animation-snapshots 2>&1
          echo "export exit code: $?"

          echo "== board-animation-snapshots contents =="
          find board-animation-snapshots -type f 2>/dev/null
          ls -la board-animation-snapshots/ 2>/dev/null

      - name: Upload board-animation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-animation-snapshots
          path: board-animation-snapshots
          if-no-files-found: warn
