name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PawSanctuaryTests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' \
            | sort -Vr | head -1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run PawSanctuaryTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PawSanctuary.xcodeproj \
            -scheme PawSanctuary \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log

      # BoardAnimationSnapshotTests (PawSanctuaryTests/BoardAnimationSnapshotTests.swift)
      # screenshots the merge burst and producer shimmer from
      # specs/Spec_BoardAnimation_Draft.md into this Simulator's app sandbox —
      # the closest thing to an on-screen check available where no local
      # Simulator exists. Runs `if: always()` so a real test failure above
      # still gets whatever frames were captured before it failed.
      - name: Extract board-animation snapshots from the Simulator
        if: always()
        run: |
          # GitHub Actions launches `run:` steps as `bash -e {0}` — that -e is
          # already active before this script starts, so a `set -uo pipefail`
          # here does NOT turn it off (it only touches -u/pipefail). Every
          # command below is expected to sometimes fail (grep no-match, an
          # empty container path) as ordinary, handled control flow, so -e
          # must be explicitly cancelled or any one of them kills this whole
          # step — which is exactly what happened on the first run.
          set +e
          set -u

          # xcodebuild test does not leave the simulator it used booted —
          # every device shows (Shutdown) by the time this step runs (found
          # by the diagnostics below on the previous attempt), so "find the
          # booted one" doesn't work. The app's container is a plain
          # on-disk path that exists regardless of boot state, so instead
          # scan every simulator UDID this runner has and keep the first
          # one that actually has our bundle ID installed — only the one
          # xcodebuild used will resolve.
          CONTAINER=""
          FOUND_UDID=""
          for UDID in $(xcrun simctl list devices | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'); do
            C=$(xcrun simctl get_app_container "$UDID" com.timothyherburger.pawsanctuary1 data 2>/dev/null)
            if [ -n "$C" ] && [ -d "$C" ]; then
              CONTAINER="$C"
              FOUND_UDID="$UDID"
              break
            fi
          done
          echo "App container lookup result: udid='${FOUND_UDID}' container='${CONTAINER}'"
          if [ -z "$CONTAINER" ] || [ ! -d "$CONTAINER" ]; then
            echo "Could not resolve the app's data container — skipping" >&2
            exit 0
          fi
          if [ ! -d "$CONTAINER/tmp/BoardAnimationSnapshots" ]; then
            echo "No BoardAnimationSnapshots directory in the app container — skipping. Container tmp/ contents:" >&2
            ls -la "$CONTAINER/tmp" >&2
            exit 0
          fi

          mkdir -p board-animation-snapshots
          cp -R "$CONTAINER/tmp/BoardAnimationSnapshots/." board-animation-snapshots/
          echo "Extracted:"
          ls -la board-animation-snapshots/

      - name: Upload board-animation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-animation-snapshots
          path: board-animation-snapshots
          if-no-files-found: warn
