name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PawSanctuaryTests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' \
            | sort -Vr | head -1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run PawSanctuaryTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PawSanctuary.xcodeproj \
            -scheme PawSanctuary \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log

      # BoardAnimationSnapshotTests (PawSanctuaryTests/BoardAnimationSnapshotTests.swift)
      # screenshots the merge burst and producer shimmer from
      # specs/Spec_BoardAnimation_Draft.md and attaches each as a PNG
      # XCTAttachment — the closest thing to an on-screen check available
      # where no local Simulator exists. Runs `if: always()` so a real test
      # failure above still gets whatever frames were captured before it.
      - name: Extract board-animation snapshots from the xcresult bundle
        if: always()
        run: |
          # GitHub Actions launches `run:` steps as `bash -e {0}` — that -e is
          # already active before this script starts, so a `set -uo pipefail`
          # here does NOT turn it off (it only touches -u/pipefail). Every
          # command below is expected to sometimes fail (find/grep no-match)
          # as ordinary, handled control flow, so -e must be explicitly
          # cancelled or any one of them kills this whole step.
          set +e
          set -u

          # Two earlier attempts tried pulling FileManager.default.temporaryDirectory
          # straight out of the Simulator's app-container sandbox via
          # `simctl get_app_container <udid> <bundle-id> data`. Both failed:
          # xcodebuild test doesn't leave any simulator booted afterward
          # (ruling out "find the booted one"), and scanning every UDID on
          # the runner for one with our bundle ID installed found nothing
          # either, for reasons not fully diagnosed. Pivoting instead to the
          # .xcresult bundle xcodebuild always produces in DerivedData — its
          # path was confirmed directly in a prior run's log
          # (.../DerivedData/PawSanctuary-*/Logs/Test/Test-PawSanctuary-*.xcresult).
          # Every screenshot is also attached via XCTAttachment(data:
          # uniformTypeIdentifier: "public.png") with .lifetime = .keepAlways
          # specifically for this: sniff the .xcresult's content-addressed
          # Data/ store for PNG blobs and pull them out directly, with no
          # dependency on xcresulttool's export-subcommand syntax (untested
          # from this session, version-sensitive) or on simulator/bundle-ID
          # lookups at all.
          XCRESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" -iname "*.xcresult" -type d 2>/dev/null | head -1)
          echo "xcresult bundle: '${XCRESULT}'"
          if [ -z "$XCRESULT" ] || [ ! -d "$XCRESULT/Data" ]; then
            echo "No .xcresult Data store found — skipping snapshot extraction" >&2
            exit 0
          fi

          mkdir -p board-animation-snapshots
          count=0
          for f in "$XCRESULT"/Data/*; do
            [ -f "$f" ] || continue
            if file "$f" | grep -q "PNG image data"; then
              count=$((count + 1))
              cp "$f" "board-animation-snapshots/snapshot_$(printf '%03d' "$count").png"
            fi
          done
          echo "Extracted ${count} PNG attachment(s) from the xcresult Data store:"
          ls -la board-animation-snapshots/ 2>/dev/null

      - name: Upload board-animation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-animation-snapshots
          path: board-animation-snapshots
          if-no-files-found: warn
