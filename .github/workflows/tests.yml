name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PawSanctuaryTests
    runs-on: macos-15
    timeout-minutes: 30
    # contents: write is needed only for the scratch-branch push near the end
    # (git push origin ci-snapshots/latest) — the repo's default GITHUB_TOKEN
    # is read-only, confirmed by that step failing with a 403 without this.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' \
            | sort -Vr | head -1)
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run PawSanctuaryTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PawSanctuary.xcodeproj \
            -scheme PawSanctuary \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            2>&1 | tee xcodebuild-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log

      # BoardAnimationSnapshotTests (PawSanctuaryTests/BoardAnimationSnapshotTests.swift)
      # screenshots the merge burst and producer shimmer from
      # specs/Spec_BoardAnimation_Draft.md and attaches each as a PNG
      # XCTAttachment — the closest thing to an on-screen check available
      # where no local Simulator exists. Runs `if: always()` so a real test
      # failure above still gets whatever frames were captured before it.
      - name: Extract board-animation snapshots from the xcresult bundle
        if: always()
        run: |
          # GitHub Actions launches `run:` steps as `bash -e {0}` — that -e is
          # already active before this script starts, so a `set -uo pipefail`
          # here does NOT turn it off (it only touches -u/pipefail). Every
          # command below is expected to sometimes fail (find/grep no-match)
          # as ordinary, handled control flow, so -e must be explicitly
          # cancelled or any one of them kills this whole step.
          set +e
          set -u

          # Two earlier attempts (pulling FileManager.default.temporaryDirectory
          # out of the Simulator's app-container sandbox, then sniffing the
          # xcresult's Data/ directory by hand for raw PNG blobs) both came
          # up empty. `xcresulttool export attachments` — no --test-id
          # filter needed, it exports everything with a matching attachment
          # across the whole bundle and just skips the rest — is what
          # actually works, confirmed against a real CI run.
          XCRESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" -iname "*.xcresult" -type d 2>/dev/null | head -1)
          echo "xcresult bundle: '${XCRESULT}'"
          if [ -z "$XCRESULT" ]; then
            echo "No .xcresult bundle found — skipping snapshot extraction" >&2
            exit 0
          fi

          mkdir -p board-animation-snapshots
          xcrun xcresulttool export attachments --path "$XCRESULT" --output-path board-animation-snapshots
          echo "Extracted:"
          ls -la board-animation-snapshots/ 2>/dev/null

      - name: Upload board-animation snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-animation-snapshots
          path: board-animation-snapshots
          if-no-files-found: warn

      # This session's own outbound proxy denies *.blob.core.windows.net —
      # where the upload-artifact step above actually stores its content —
      # by policy, not by accident, so a Claude session driving this PR
      # cannot download that artifact to look at it. Publishing the same
      # PNGs to a throwaway branch lets it read them back via the regular
      # GitHub API instead (already working fine for everything else this
      # workflow does). Safe to delete this branch at any time; nothing
      # depends on it persisting.
      - name: Publish snapshots to a scratch branch for review
        if: always()
        continue-on-error: true  # best-effort visibility only; must never affect the real test-suite signal
        run: |
          set +e
          set -u
          if [ ! -d board-animation-snapshots ] || [ -z "$(ls -A board-animation-snapshots 2>/dev/null)" ]; then
            echo "No snapshots to publish — skipping" >&2
            exit 0
          fi
          cp -R board-animation-snapshots /tmp/board-animation-snapshots-preserve
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A single, stable, force-pushed branch name — overwritten every run
          # rather than one per commit — so it never needs looking up.
          BRANCH="ci-snapshots/latest"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1
          cp /tmp/board-animation-snapshots-preserve/* .
          git add -A
          git commit -m "Board animation snapshots for ${{ github.sha }}"
          git push origin "$BRANCH" --force
          echo "push exit code: $?"
